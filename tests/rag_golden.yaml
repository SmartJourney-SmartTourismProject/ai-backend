# --- out of scope: must refuse, not guess ---

- question: "What's the best nightclub in Paris?"
  answerable: false

- question: "Do I need a visa to visit Japan?"
  answerable: false

- question: "What is the capital of Germany?"
  answerable: false

- question: "How do I bake a chocolate cake?"
  answerable: false

- question: "What's the weather like in London tomorrow?"
  answerable: false
