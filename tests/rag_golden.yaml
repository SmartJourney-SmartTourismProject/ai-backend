# Golden evaluation set for the RAG knowledge base (app/rag/), run by
# scripts/eval_rag.py. Two kinds of case:
#
#   answerable: true  - a real Sri Lanka travel question the knowledge base
#     (Wikivoyage + app/data/knowledge/*.md team notes) should answer.
#     `expect_source_title` is checked as a case-insensitive substring
#     against the title of the top-ranked retrieved passage - this is a
#     retrieval-quality check (did the right document surface at all), not
#     a check on the LLM's prose.
#   answerable: false - a question the knowledge base has no business
#     answering (a different country, or nothing to do with Sri Lanka
#     travel at all). The system must refuse rather than guess.
#
# Chosen to cover: visas, safety/scams, etiquette, transport, health,
# money, festivals, and out-of-scope refusals - not just one note type.

- question: "Do I need a visa to visit Sri Lanka?"
  answerable: true
  expect_source_title: "Electronic Travel Authorization"

- question: "Where do I apply for an ETA?"
  answerable: true
  expect_source_title: "Electronic Travel Authorization"

- question: "Can I buy alcohol on a Poya day?"
  answerable: true
  expect_source_title: "Poya day alcohol"

- question: "What should I wear when visiting the Temple of the Sacred Tooth Relic?"
  answerable: true
  expect_source_title: "Temple and religious site dress code"

- question: "Do I need to take my shoes off at a Buddhist temple?"
  answerable: true
  expect_source_title: "Temple and religious site dress code"

- question: "How much should a tuk-tuk cost in Sri Lanka?"
  answerable: true
