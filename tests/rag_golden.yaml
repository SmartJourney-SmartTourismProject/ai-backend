- question: "Which hand should I eat rice and curry with?"
  answerable: true
  expect_source_title: "Left-hand etiquette"

- question: "What are common tourist scams to watch out for in Sri Lanka?"
  answerable: true
  expect_source_title: "Sri Lanka"

- question: "Do I need a visa to visit Kandy?"
  answerable: true
  expect_source_title: "Electronic Travel Authorization"

- question: "What is Colombo like as a city to visit?"
  answerable: true
  expect_source_title: "Colombo"

- question: "What can I see and do in Galle?"
  answerable: true
  expect_source_title: "Galle"

- question: "Is Sigiriya worth visiting?"
  answerable: true
  expect_source_title: "Sigiriya"

- question: "What should I know about visiting Yala National Park?"
  answerable: true
