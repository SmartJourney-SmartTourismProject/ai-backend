name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No database, Redis, or external API keys - tests/conftest.py fakes the
# cache, weather/disaster feeds, calendar and session store, and
# `-m "not external"` skips anything that still needs a live key/quota
# (see pytest.ini). See Documentation/Testing/MASTER_TEST_PLAN.md.
jobs:
  test:
    runs-on: ubuntu-latest
    # Placeholders, not secrets: get_llm() and routing_tool gate on a key being
    # present, but every non-external test mocks the actual network call.
    env:
      GEMINI_API_KEY: ci-placeholder
      GROQ_API_KEY: ci-placeholder
      ORS_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -m "not external" -q

  # ---- CD: only on main, only after the tests pass --------------------------
  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/smartjourney-smarttourismproject
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/ai-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/ai-backend:latest
          cache-from: type=gha,scope=ai-backend
          cache-to: type=gha,scope=ai-backend,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # One production deploy at a time, across every repo's pipeline.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      # Until the server exists and the secrets are added (see
      # deploy/MANUAL_SETUP.md) this job skips cleanly instead of failing.
      - name: Check deploy secrets
        id: gate
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "::notice::Deploy skipped: SERVER_HOST / SERVER_USER / SERVER_SSH_KEY are not configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up SSH
        if: steps.gate.outputs.enabled == 'true'
        run: |
          install -d -m 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      # deploy.sh (copied to the server by the backend pipeline) pulls the new
      # image, restarts the container, waits for its healthcheck and rolls back
      # to the previous tag if it never becomes healthy.
      - name: Deploy ai-backend
        if: steps.gate.outputs.enabled == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" "cd /opt/smartjourney && ./deploy.sh ai-backend ${{ github.sha }}"
